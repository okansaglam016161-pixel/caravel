<!-- Caravel app tile, v0.3 Foundation.
     The nav-rail lockup at favicon size: the accent tile (cobalt/400 #378ADD, the single accent)
     carrying the LIGHT mark, exactly as "05 PRIMITIVES to Nav rail" draws it. The mark is embedded
     as a data URI because a favicon cannot read CSS custom properties and cannot fetch a sibling
     asset reliably across browsers, so the one file has to be self-contained.
     Source asset: assets/logo-light.png (358x401) from the design project.
     NB: no double hyphens in this comment, they are illegal in XML and break the parse. -->
<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <rect width="44" height="44" rx="13" fill="#378ADD"/>
  <image x="9.72" y="8.25" width="24.55" height="27.5" href="data:image/png;base64,"/>
</svg>
