<!-- Caravel app tile, favicon grade.
     The brand tile carrying the SMALL grade of the bespoke sail: no seam, a thicker belly and mast,
     white on cobalt/400 (#378ADD, the single accent). It is the same composition LogoTile draws in
     the app, at the size the small grade was drawn for, so the tab icon and the nav rail are one
     mark rather than two that resemble each other.
     GEOMETRY IS DERIVED, NOT EYEBALLED. On a 100 unit tile: radius 22.5 (22.5%, the design's ratio
     across every tile it draws), and the mark at 108.2% of the tile so the sail and wake BLEED past
     the edges and are clipped by the rounded corners. No inset, no inner circle. The transform maps
     the design's own viewBox (10 6 84 88) onto that box; the paths below are its clMarkTiny, copied
     verbatim.
     SELF CONTAINED, AND IT HAS TO BE. A favicon cannot read CSS custom properties and cannot
     reliably fetch a sibling asset, so the colours are baked in. This replaces a version that
     embedded the OLD mark as a base64 raster; the mark ships as geometry now, which is why this
     file is a twentieth of the size and sharp at every scale.
     NB: no double hyphens in this comment, they are illegal in XML and break the parse. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <clipPath id="tile"><rect width="100" height="100" rx="22.5"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="100" height="100" fill="#378ADD"/>
    <g transform="translate(-13.9364 -11.4773) scale(1.229545)">
      <path d="M14 87 C38 76 62 73 88 77 L84 84 C62 79.5 40 80.5 16 89 Z" fill="#FFFFFF"/>
      <path d="M43.2 16 C66 26 77 46 70 64 L32.6 66 Z" fill="#FFFFFF" fill-opacity=".18" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
      <path d="M44.5 10 L30 76" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
