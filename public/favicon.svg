<!-- Caravel "Full Sail" mark on the dark app tile. Geometry is the same three paths as
     src/components/primitives/Logo.tsx (viewBox 0 0 44 44); the tile and 0.65 inset match the
     "avatar / app icon / favicon" row of the Logo Refinement design. Colours are literal
     because a favicon cannot read CSS custom properties: teal-500 #2DE0C6, sail gradient
     accL #5CEAD6 to teal-grad-bottom #12A594, tile #070C12.
     NB: no double hyphens in this comment, they are illegal in XML and break the parse. -->
<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <defs>
    <linearGradient id="sail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CEAD6"/>
      <stop offset="1" stop-color="#12A594"/>
    </linearGradient>
  </defs>
  <rect width="44" height="44" rx="13" fill="#070C12"/>
  <!-- mark scaled to 65% about the tile centre: 22 - 0.65*22 = 7.7 -->
  <g transform="translate(7.7 7.7) scale(0.65)">
    <path d="M20 3 C 33 8 37 22 36 31 L 20 31 Z" fill="url(#sail)"/>
    <path d="M15.5 12 C 11 17 8.5 25 8.5 31 L 15.5 31 Z" fill="#2DE0C6" opacity="0.45"/>
    <path d="M5 35 L 39 35 L 33.5 41 L 10.5 41 Z" fill="#2DE0C6"/>
  </g>
</svg>
