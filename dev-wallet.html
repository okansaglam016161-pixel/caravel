  <body>
    <!--
      M4 STAGE 1 — a standalone preview of the redesigned wallet modal.

      A SEPARATE ENTRY POINT, NOT A ROUTE. A dev-guarded route inside App.tsx still emits its lazy
      chunk into `dist/` — a runtime guard does not stop the bundler from following the import. Vite's
      default build input is index.html alone, so a second root HTML file is served in `npm run dev`
      and is never built, never bundled, never deployed. That is the only arrangement where
      "dev-only" is actually true.

      It also keeps the harness genuinely standalone: no router, no WalletProvider, no wallet, no
      network. Mock data only.
    -->
    <div id="root"></div>
    <script type="module" src="/src/dev/main.tsx"></script>
  </body>
</html>
