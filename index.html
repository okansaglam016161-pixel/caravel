<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#378ADD" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caravel</title>

    <!-- Link preview. og:image and twitter:image MUST be absolute: scrapers do not resolve
         relative URLs, and a relative one is simply dropped. The card itself is generated -
         see scripts/og-card.svg and `npm run icons`. -->
    <meta name="description" content="A Swiss bank account in your pocket." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Caravel" />
    <meta property="og:url" content="https://caravellabs.net/" />
    <meta property="og:title" content="Caravel" />
    <meta property="og:description" content="A Swiss bank account in your pocket." />
    <meta property="og:image" content="https://caravellabs.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Caravel - a Swiss bank account in your pocket." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://caravellabs.net/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
